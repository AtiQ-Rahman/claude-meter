<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Meter settings</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Claude Meter settings</h1>
  <p class="muted">Changes save automatically.</p>

  <section>
    <h2>Alerts</h2>
    <label class="field">First alert at <input type="number" data-key="warnPct" min="1" max="100"> %</label>
    <label class="field">Critical alert at <input type="number" data-key="critPct" min="1" max="100"> %
      <span class="muted small">notification stays until dismissed</span></label>
    <label class="field">Then alert on every percent from <input type="number" data-key="everyPctFrom" min="1" max="100"> %</label>
    <label class="check"><input type="checkbox" data-key="forecastAlert">
      Warn when my pace will hit 100% within <input type="number" data-key="forecastMinutes" min="5" max="300"> minutes</label>
    <label class="check"><input type="checkbox" data-key="notifyOnReset"> Tell me when a limit I was warned about resets</label>
  </section>

  <section>
    <h2>Sound</h2>
    <label class="check"><input type="checkbox" data-key="sound"> Play a sound with alerts</label>
    <label class="field">Volume <input type="range" data-key="volume" min="0" max="1" step="0.05"></label>
    <div class="buttons">
      <button data-sound="warn">Test warning</button>
      <button data-sound="crit">Test critical</button>
      <button data-sound="reset">Test reset</button>
    </div>
  </section>

  <section>
    <h2>Display</h2>
    <label class="field">Toolbar badge shows
      <select data-key="badge">
        <option value="max">Highest limit</option>
        <option value="five_hour">Session</option>
        <option value="seven_day">Week</option>
      </select>
    </label>
    <label class="field">Check every <input type="number" data-key="pollMinutes" min="1" max="60"> minutes
      <span class="muted small">also checks after you send a message on claude.ai</span></label>
    <label class="field">Organization
      <select data-key="orgId" id="org-select">
        <option value="">Automatic (your Pro or Max plan)</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Diagnostics</h2>
    <p class="muted small">If the meter shows an error, this is what claude.ai returned. Nothing here leaves your browser.</p>
    <div id="diag-status"></div>
    <pre id="diag-raw"></pre>
    <button id="diag-refresh">Check now</button>
  </section>

  <script type="module" src="options.js"></script>
</body>
</html>
